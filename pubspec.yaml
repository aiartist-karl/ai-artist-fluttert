  json_annotation: ^4.8.1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  url_launcher: ^6.2.4
  path_provider: ^2.1.2
  sqflite: ^2.3.2
